{{- if .Values.apisixRoute.enabled }}
{{- /*
APIsix-native ApisixRoute (apisix.apache.org/v2) — used when a service
needs WebSocket support, which Gateway API HTTPRoute can't express
through the apisix-ingress-controller v2 conversion (it never sets
enable_websocket on the resulting APIsix route, so upgrades fail with
HTTP 426 from the upstream).

Use either apisixRoute OR gatewayApi, never both for the same paths —
APIsix doesn't deduplicate route definitions across CRDs and you'd
get unpredictable winner selection.

Each rule supports:
  - name (required, unique within the resource)
  - match.hosts, match.paths, match.methods, match.exprs
  - websocket: bool (per-rule, default false)
  - plugins: inline plugin config (replaces ExtensionRef → PluginConfig)
  - plugin_config_name: reference an ApisixPluginConfig (v2 CRD)
  - timeout, retries, etc.
  - backends: list of {serviceName, servicePort, weight}
*/}}
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: {{ include "stateless.fullname" . }}
  labels:
    {{- include "stateless.labels" . | nindent 4 }}
spec:
  {{- with .Values.apisixRoute.ingressClassName }}
  ingressClassName: {{ . }}
  {{- end }}
  http:
    {{- range $rule := .Values.apisixRoute.http }}
    - name: {{ $rule.name }}
      {{- with $rule.priority }}
      priority: {{ . }}
      {{- end }}
      match:
        {{- with $rule.match.hosts }}
        hosts:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with $rule.match.paths }}
        paths:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with $rule.match.methods }}
        methods:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with $rule.match.exprs }}
        exprs:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      {{- if hasKey $rule "websocket" }}
      websocket: {{ $rule.websocket }}
      {{- end }}
      {{- with $rule.timeout }}
      timeout:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      backends:
        {{- range $b := $rule.backends }}
        - serviceName: {{ $b.serviceName | default (include "stateless.fullname" $) }}
          servicePort: {{ $b.servicePort }}
          {{- with $b.weight }}
          weight: {{ . }}
          {{- end }}
          {{- with $b.subset }}
          subset: {{ . }}
          {{- end }}
        {{- end }}
      {{- with $rule.plugins }}
      plugins:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $rule.plugin_config_name }}
      plugin_config_name: {{ . }}
      {{- end }}
    {{- end }}
{{- end }}
