{{- if .Values.gatewayApi.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "stateless.fullname" . }}
  labels:
    {{- include "stateless.labels" . | nindent 4 }}
spec:
  {{- with .Values.gatewayApi.parentRefs }}
  parentRefs:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.gatewayApi.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- if .Values.gatewayApi.rules }}
  rules:
    {{- toYaml .Values.gatewayApi.rules | nindent 4 }}
  {{- else }}
  {{- /* Default: route all paths to this service's first port */}}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "stateless.fullname" . }}
          port: {{ (index .Values.service.ports 0).port }}
  {{- end }}
{{- end }}
