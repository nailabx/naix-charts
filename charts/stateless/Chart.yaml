apiVersion: v2
name: stateless
description: |
  Universal Helm chart for stateless Kubernetes workloads.
  Renders one or more containers with optional feature blocks for routing
  (k8s Ingress, Gateway API HTTPRoute, APIsix per-route plugins), config
  (ConfigMap), secrets (External Secrets Operator), autoscaling (HPA or
  KEDA), resilience (PodDisruptionBudget, NetworkPolicy), and observability
  (Prometheus Operator PodMonitor / ServiceMonitor). Every feature block
  is opt-in (`enabled: false` default), so the chart works equally well
  for a one-liner nginx deployment or a fully-wired microservice behind
  a shared gateway.

type: application

# Chart version. Bump on every change. Major bump on breaking values changes.
version: 1.1.2

# AppVersion is overridable per-release via image.tag — leaving as a sane
# baseline for charts deployed without an explicit tag.
appVersion: "1.0.0"

# Minimum Kubernetes version. The `-0` suffix on the lower bound is
# intentional: it tells Helm's semver constraint to accept versions with
# pre-release suffixes too (e.g. EKS reports cluster versions as
# `1.35.3-eks-bbe087e`, which without `-0` would fail the constraint
# because Helm orders pre-releases below their release counterparts).
kubeVersion: ">=1.27.0-0"

home: https://github.com/nailabx/naix-charts
sources:
  - https://github.com/nailabx/naix-charts

maintainers:
  - name: Nailabx
    url: https://github.com/nailabx

keywords:
  - microservice
  - stateless
  - apisix
  - gateway-api
  - external-secrets
  - keda

annotations:
  artifacthub.io/category: integration-delivery
  artifacthub.io/license: MIT
